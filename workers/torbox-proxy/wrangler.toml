name = "torbot-dl"
main = "worker.js"
compatibility_date = "2024-11-01"

# PROXY_SECRET and TORBOX_API_KEY live in the dashboard, not this file. Without
# this, every `wrangler deploy` would delete them and break every link.
keep_vars = true

# Free workers.dev URL after deploy:
#   https://torbot-dl.<your-subdomain>.workers.dev
#
# Secrets (do not put in this file):
#   npx wrangler secret put PROXY_SECRET   # 16+ chars, same as bot
#   npx wrangler secret put TORBOX_API_KEY
#
# Optional vars:
# [vars]
# TORBOX_API_BASE = "https://api.torbox.app/v1"
